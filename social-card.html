
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 1200px;
      height: 630px;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #social-card {
      position: relative;
      display: grid;
      grid-template-columns: 450px 1fr;
      align-items: center;
      gap: 54px;
      width: 1200px;
      height: 630px;
      padding: 55px 65px;
      color: #0a1730;
      background:
        radial-gradient(circle at 5% 10%, #afd8ff80, transparent 42%),
        linear-gradient(110deg, #f8fffd, #ffffff 55%, #e8fff5);
    }

    #social-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 8px;
      background: linear-gradient(
        90deg,
        #7c86ff, #68a5ff, #62c5ff,
        #63e5fb, #75ffce, #89fe9e, #abff72
      );
    }

    .photo-panel {
      position: relative;
      height: 490px;
      border: 1px solid #d1e8ee;
      border-radius: 45px 45px 110px 45px;
      background: linear-gradient(145deg, #ffffff, #e7f5fb, #eafff3);
      box-shadow: 0 22px 48px #174a7020;
    }

    .photo-frame {
      position: absolute;
      inset: 23px 65px 22px;
      overflow: hidden;
      background: #f7f9fa;
      border: 7px solid #ffffff;
      border-radius: 190px 190px 85px 85px;
      box-shadow: 0 12px 25px #174a701c;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .curiosity {
      position: absolute;
      bottom: 12px;
      left: -18px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 17px;
      border-radius: 16px;
      border: 1px solid #d7e7ef;
      background: #ffffffef;
      color: #547b88;
      box-shadow: 0 12px 26px #234c7220;
      transform: rotate(-3deg);
      font-size: 15px;
    }

    .curiosity strong {
      display: block;
      color: #2760a5;
    }

    .star {
      color: #24bcae;
      font-size: 29px;
    }

    .eyebrow {
      font-size: 14px;
      letter-spacing: .19em;
      font-weight: 800;
      color: #168ca0;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 25px;
      font-size: 65px;
      line-height: 1.09;
      letter-spacing: -.06em;
      color: #0a1730;
    }

    h1 span { color: #2760a5; }

    .expertise {
      border-left: 5px solid #68a5ff;
      padding-left: 17px;
      color: #1a5172;
      font-size: 18px;
      line-height: 1.5;
      font-weight: 700;
    }

    .description {
      margin-top: 22px;
      max-width: 530px;
      font-size: 19px;
      line-height: 1.6;
      color: #52778a;
    }
  </style>
</head>

<body>
  <main id="social-card">
    <div class="photo-panel">
      <div class="photo-frame">
        <img id="social-photo" alt="Portrait of Unique">
      </div>

      <div class="curiosity">
        <span class="star">✳</span>
        <span>
          Curiosity first.
          <strong>Evidence always.</strong>
        </span>
      </div>
    </div>

    <div>
      <div class="eyebrow">PERSONAL PORTFOLIO</div>

      <h1>
        Unique Desyrre<br>
        <span>A. Resiloy.</span>
      </h1>

      <div class="expertise" id="social-expertise"></div>

      <p class="description">
        I like reading the news. Sometimes a small detail
        catches my attention, and I end up turning to data
        to make sense of it.
      </p>
    </div>
  </main>

  <script src="data.js"></script>
  <script>
    const profile = window.PORTFOLIO_DATA.profile;

    document.getElementById("social-photo").src = profile.photo;
    document.getElementById("social-expertise").textContent =
      profile.expertise.replace(/\s*\|\s*/g, " · ");
  </script>
</body>
</html>
