
name: Publish Portfolio with Thumbnail

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Generate social thumbnail
        run: node scripts/build-social-image.mjs

      - name: Prepare website
        run: |
          mkdir -p dist
          cp index.html app.js data.js styles.css dist/
          cp -R assets dist/assets

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./dist"

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
